services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: ai-service-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_service
    ports:
      - "5433:5432"  # host port 5433: a local PostgreSQL service already uses 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_service"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ai-service-redis
    restart: unless-stopped
    ports:
      - "6380:6379"  # host port 6380: another container already uses 6379
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    # Day 10 task 5: a second vector store, to compare with pgvector. Not used unless chosen by config.
    image: qdrant/qdrant:v1.20.2
    container_name: ai-service-qdrant
    restart: unless-stopped
    ports:
      - "127.0.0.1:6333:6333"  # this machine only: Qdrant has no authentication by default
    environment:
      QDRANT__TELEMETRY_DISABLED: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # the image has no curl or wget, so bash opens the HTTP connection itself
      test: ["CMD", "bash", "-c", 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf "GET /readyz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && grep -q "200 OK" <&3']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-service-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_service
      - QDRANT_URL=http://qdrant:6333
      - REDIS_URL=redis://redis:6379/0
      # the file built into the image; set here so that an empty value in .env cannot hide it
      - TOKENIZER_PATH=/opt/bge-m3/tokenizer.json
      # pgvector (default) or qdrant, from the shell or .env
      - VECTOR_STORE=${VECTOR_STORE:-pgvector}
    volumes:
      - ./src:/app/src
    # apply database migrations first, then start the API (stops here if a migration fails)
    command: ["sh", "-c", "alembic upgrade head && uvicorn ai_service.main:app --host 0.0.0.0 --port 8000 --reload"]
    healthcheck:
      # the slim image has no curl, so use Python itself
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    # Day 11: runs the jobs that the API puts in Redis (ARQ). Same image and code as the API.
    # It does not reload by itself: after a code change, `docker compose restart worker`.
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ai-service-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy  # the api applies the database migrations first
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/ai_service
      - REDIS_URL=redis://redis:6379/0
      # the file built into the image; set here so that an empty value in .env cannot hide it
      - TOKENIZER_PATH=/opt/bge-m3/tokenizer.json
      - QDRANT_URL=http://qdrant:6333
      - VECTOR_STORE=${VECTOR_STORE:-pgvector}
    volumes:
      - ./src:/app/src
    command: ["arq", "ai_service.worker.WorkerSettings"]
    healthcheck:
      # succeeds only while a worker keeps writing its "alive" key in Redis
      test: ["CMD", "arq", "ai_service.worker.WorkerSettings", "--check"]
      interval: 10s
      timeout: 10s
      retries: 3
      start_period: 15s

  frontend:
    # the React app (./frontend): nginx serves the built site and forwards /api to the api service
    build:
      context: ./frontend
    container_name: ai-service-frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "3000:80"  # http://localhost:3000 (5173 stays free for `npm run dev`)

volumes:
  postgres_data:
  redis_data:
  qdrant_data:

